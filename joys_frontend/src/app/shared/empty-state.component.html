<div class="empty-state-wrapper">

  <div class="icon-circle reveal">
    <span class="emoji-content">{{ emoji }}</span>
  </div>

  <div class="text-content reveal delay-1">
    <h3 class="state-title">{{ title }}</h3>
    @if (description) {
      <p class="state-desc">
        {{ description }}
      </p>
    }
  </div>

  <div class="action-slot reveal delay-2">
    <ng-content></ng-content>
  </div>

</div>
