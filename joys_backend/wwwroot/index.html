  <style>
    body { margin: 0; padding: 0; background-color: #080808; overflow-x: hidden; }

    /* Le Loader qui s'affiche AVANT Angular */
    .app-loading {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #080808; z-index: 9999;
      font-family: 'Times New Roman', serif; /* Fallback élégant */
    }

    .app-loading .logo-text {
      color: #FFFFFF;
      font-size: 2.5rem; /* Plus grand pour l'impact */
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 30px;
      opacity: 0;
      animation: fadeText 3s ease-in-out infinite alternate;
    }

    .app-loading .spinner {
      width: 60px; height: 60px;
      border: 2px solid rgba(197, 160, 89, 0.1); /* Or très pâle */
      border-top-color: #C5A059; /* Or Vif */
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 15px rgba(197, 160, 89, 0.2); /* Lueur dorée */
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes fadeText { 0% { opacity: 0.3; letter-spacing: 4px; } 100% { opacity: 1; letter-spacing: 6px; } }
  </style>
